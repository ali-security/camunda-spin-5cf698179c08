name: Seal Build

# Upstream builds camunda-spin on Jenkins (.ci.cambpm: jdk 11, mvn 3.8) and ships
# no GitHub Actions build/test workflow; this file mirrors that Jenkins job.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

env:
  # XmlDom*MapJavaToXml* tests expect dates rendered in the Europe/Berlin zone
  TZ: Europe/Berlin

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Build and test (full reactor)
        run: |
          # clirr (check-api-compatibility profile) is an API-compat gate, not a test
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./mvnw -B -V install -Dclirr.skip=true \
              -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false
          else
            ./mvnw -B -V install -Dclirr.skip=true
          fi

      - name: Test summary and skip report
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          reasons = {
            "JsonTreeEditListPropertyJavascriptTest": "upstream @Ignore: javascript implementation changed (CAM-3612)",
            "JsonTreeMapObjectToJsonJavascriptTest": "upstream @Ignore: Jackson cannot map the JS engine's internal object/array representations",
          }
          tot = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          skipped = []
          for f in sorted(glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True)):
              r = ET.parse(f).getroot()
              for k in tot:
                  tot[k] += int(r.get(k, 0))
              for tc in r.iter("testcase"):
                  if tc.find("skipped") is not None:
                      cls = tc.get("classname", "")
                      short = cls.rsplit(".", 1)[-1]
                      skipped.append((cls, tc.get("name"), reasons.get(short, "upstream @Ignore")))
          print("==== Skipped tests (%d) ====" % len(skipped))
          for cls, name, why in skipped:
              print("SKIPPED %s#%s -- %s" % (cls, name, why))
          passed = tot["tests"] - tot["failures"] - tot["errors"] - tot["skipped"]
          print("==== Surefire totals: Tests run: %d, Passed: %d, Failures: %d, Errors: %d, Skipped: %d ===="
                % (tot["tests"], passed, tot["failures"], tot["errors"], tot["skipped"]))
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: camunda-spin-dataformat-all
          path: dataformat-all/target/camunda-spin-dataformat-all-1.23.0.jar
          if-no-files-found: error
